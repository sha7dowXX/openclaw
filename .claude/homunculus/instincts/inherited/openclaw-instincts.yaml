# Openclaw Workflow Refine Or Add Test Coverage For Command Or Feature

## Action

Follow the refine-or-add-test-coverage-for-command-or-feature workflow:
1. Identify command or feature needing test refinement or coverage.
2. Edit or create corresponding test files (often in src/commands/ or src/agents/).
3. Adjust mocks, fixtures, or test imports as needed.
4. Sometimes move or split test cases between files for isolation.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~10x per month
- Files: src/commands/*.test.ts, src/commands/*/*.test.ts, src/commands/*/*.ts

